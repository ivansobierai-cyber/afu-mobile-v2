name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: afu_mobile
          MYSQL_USER: afu
          MYSQL_PASSWORD: afu_local_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uafu -pafu_local_dev"
          --health-interval=8s
          --health-timeout=5s
          --health-retries=20
    env:
      JWT_SECRET: ci_jwt_secret_afu_mobile_validate
      NODE_ENV: test
      DATABASE_URL: mysql://afu:afu_local_dev@127.0.0.1:3306/afu_mobile
      # Somente harness de integração (tests/db-schema-prepare.test.ts): CREATE/DROP banco efêmero
      SCHEMA_PREPARE_TEST_ADMIN_URL: mysql://root:root@127.0.0.1:3306/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Apply schema (MySQL)
        run: npm run db:schema:prepare

      - name: Verify schema (migrations obrigatórias)
        run: npm run db:schema:verify


      - name: Build web (Vercel)
        run: npm run build:web:preview && npm run prepare:web-dist

      - name: Unit + integration tests (com DATABASE_URL)
        run: npm run test:ci

      - name: Aceite painel propriedades (evidência)
        run: AFU_RUN_DB_TESTS=1 npm run test:propriedades:etapa2
