name: Android AFU AGI

on:
  push:
    branches: [main]
    paths:
      - "apps/agi-mobile/**"
      - ".github/workflows/android-agi.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/agi-mobile/**"
      - ".github/workflows/android-agi.yml"

jobs:
  agi-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agi-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install platform 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # Debug keystore for CI (not for Play Store)
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=AFU AGI CI,O=AFU Agro,C=BR"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: afu-agi-debug-apk
          path: apps/agi-mobile/app/build/outputs/apk/debug/app-debug.apk
